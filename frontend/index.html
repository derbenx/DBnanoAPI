<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NanoGo Pro Editor</title>
</head>
<body>
    <div id="app">
        <div class="tabs">
            <div class="tab active" data-tab="create">Create</div>
            <div class="tab" data-tab="batches">Batches</div>
            <div class="tab" data-tab="settings">Settings</div>
        </div>

        <div id="tab-create" class="tab-content main-content">
            <div class="left-panel">
                <div class="top-split">
                    <div class="panel-header">
                        <span>Images</span>
                        <div class="header-btns">
                            <button onclick="window.SelectAndAddMultipleImages()">Add Images</button>
                            <button onclick="window.OpenImageFolder()">Image Folder</button>
                            <button onclick="window.CreateNewImage()">New Image</button>
                        </div>
                    </div>
                    <div class="list-header">
                        <span style="width: 30px">Sel</span>
                        <span style="width: 30px">#</span>
                        <span style="width: 60px">MBs</span>
                        <span style="width: 50px">Tasks</span>
                        <span style="flex: 1">Image</span>
                    </div>
                    <div id="image-list" class="list-content"></div>
                </div>
                <div class="bottom-split">
                    <div class="panel-header">
                        <span>Tasks</span>
                        <button onclick="window.AddTaskFromUI()">Add Task</button>
                    </div>
                    <div class="list-header">
                        <span style="width: 60px">Img</span>
                        <span style="width: 120px">Tier</span>
                        <span style="width: 60px">Ratio</span>
                        <span style="width: 100px">Status</span>
                        <span style="flex: 1">Prompt</span>
                    </div>
                    <div id="task-list" class="list-content"></div>
                </div>
                <div class="btn-group">
                    <button id="btn-load-session">Load Session</button>
                    <button id="btn-save-session">Save Session</button>
                    <div style="flex: 1"></div>
                    <button id="btn-run-immediate" style="background-color: #27ae60">RUN IMMEDIATE</button>
                    <button id="btn-run-batch" style="background-color: #8e44ad">RUN BATCH</button>
                </div>
            </div>
            <div class="right-panel">
                <div id="editor-container">
                    <div class="input-field">
                        <label>Source IDs:</label>
                        <input type="text" id="source-ids" onchange="window.UpdateTaskFromUI()">
                    </div>
                    <div class="input-field">
                        <label>Positive Prompt:</label>
                        <textarea id="prompt" rows="10" onchange="window.UpdateTaskFromUI()"></textarea>
                    </div>
                    <div class="input-field">
                        <label>Negative Prompt:</label>
                        <textarea id="neg-prompt" rows="3" onchange="window.UpdateTaskFromUI()"></textarea>
                    </div>
                    <div class="input-field">
                        <label>Tier:</label>
                        <select id="tier-select" onchange="window.UpdateTaskFromUI()">
                            <option>Nano Flash 1K</option>
                            <option>Nano Pro 1K</option>
                            <option>Nano Pro 2K</option>
                            <option>Nano Pro 4K</option>
                            <option>Nano 2 1K</option>
                            <option>Nano 2 2K</option>
                            <option>Nano 2 4K</option>
                            <option>Imagen 2K</option>
                            <option>Imagen Ultra 2K</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Aspect Ratio:</label>
                        <select id="ratio-select" onchange="window.UpdateTaskFromUI()">
                            <option>1:1</option>
                            <option>3:4</option>
                            <option>4:3</option>
                            <option>9:16</option>
                            <option>16:9</option>
                            <option>21:9</option>
                            <option>1:8</option>
                            <option>1:4</option>
                            <option>2:3</option>
                            <option>4:5</option>
                            <option>5:4</option>
                            <option>3:2</option>
                            <option>4:1</option>
                            <option>8:1</option>
                        </select>
                    </div>
                    <div id="cost-display" style="font-weight: bold; font-size: 1.0em; color: #f1c40f; margin-top: 10px;">Immediate: $0.0000 | Batch: $0.0000</div>
                </div>
                <div id="preview-container" style="display: none;">
                    <div id="image-preview">No image selected</div>
                </div>
            </div>
        </div>

        <div id="tab-batches" class="tab-content" style="display: none; height: calc(100% - 41px - 150px); overflow-y: auto; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Active Batch Jobs</h2>
                <div id="batch-timer-container" style="font-weight: bold; color: #3498db;">Next check in: --s</div>
                <button onclick="window.ClearFinishedJobs()" style="background-color: #e74c3c">Clear Finished</button>
            </div>
            <div id="batch-list"></div>
        </div>

        <div id="tab-settings" class="tab-content" style="display: none; height: calc(100% - 41px); overflow-y: auto; padding: 20px;">
            <h2>Settings</h2>
            <div class="settings-grid">
                <div class="settings-section">
                    <h3>API & Path</h3>
                    <div class="input-field">
                        <label>Gemini API Key:</label>
                        <input type="text" id="settings-api-key">
                    </div>
                    <div class="input-field">
                        <label>Output Directory:</label>
                        <input type="text" id="settings-output-dir">
                    </div>
                    <div class="input-field">
                        <label>Debug Mode:</label>
                        <input type="checkbox" id="settings-debug">
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Generation Hints</h3>
                    <div class="input-field">
                        <label>Encourage Generation:</label>
                        <textarea id="settings-encourage-gen" rows="3"></textarea>
                    </div>
                    <div class="input-field">
                        <label>Encourage Editing:</label>
                        <textarea id="settings-encourage-edt" rows="3"></textarea>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Parameters</h3>
                    <div class="input-field">
                        <label>Temperature (0-2):</label>
                        <input type="number" id="settings-temp" step="0.1" min="0" max="2">
                    </div>
                    <div class="input-field">
                        <label>Top P (0-1):</label>
                        <input type="number" id="settings-top-p" step="0.05" min="0" max="1">
                    </div>
                    <div class="input-field">
                        <label>Top K:</label>
                        <input type="number" id="settings-top-k">
                    </div>
                    <div class="input-field">
                        <label>Max Output Tokens:</label>
                        <input type="number" id="settings-max-tokens">
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Safety Thresholds</h3>
                    <div class="input-field">
                        <label>Harassment:</label>
                        <select id="safety-harassment">
                            <option>BLOCK_NONE</option>
                            <option>BLOCK_ONLY_HIGH</option>
                            <option>BLOCK_MEDIUM_AND_ABOVE</option>
                            <option>BLOCK_LOW_AND_ABOVE</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Hate Speech:</label>
                        <select id="safety-hate">
                            <option>BLOCK_NONE</option>
                            <option>BLOCK_ONLY_HIGH</option>
                            <option>BLOCK_MEDIUM_AND_ABOVE</option>
                            <option>BLOCK_LOW_AND_ABOVE</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Sexually Explicit:</label>
                        <select id="safety-sex">
                            <option>BLOCK_NONE</option>
                            <option>BLOCK_ONLY_HIGH</option>
                            <option>BLOCK_MEDIUM_AND_ABOVE</option>
                            <option>BLOCK_LOW_AND_ABOVE</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label>Dangerous Content:</label>
                        <select id="safety-danger">
                            <option>BLOCK_NONE</option>
                            <option>BLOCK_ONLY_HIGH</option>
                            <option>BLOCK_MEDIUM_AND_ABOVE</option>
                            <option>BLOCK_LOW_AND_ABOVE</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Custom Model IDs</h3>
                    <div class="input-field"><label>Nano Flash:</label><input type="text" id="settings-model-flash"></div>
                    <div class="input-field"><label>Nano Pro:</label><input type="text" id="settings-model-pro"></div>
                    <div class="input-field"><label>Nano 2:</label><input type="text" id="settings-model-2"></div>
                    <div class="input-field"><label>Imagen:</label><input type="text" id="settings-model-imagen"></div>
                    <div class="input-field"><label>Imagen Ultra:</label><input type="text" id="settings-model-ultra"></div>
                </div>
            </div>
            <div class="settings-footer">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="window.TestConnection()">Test API Connection</button>
                    <span id="test-api-status" style="font-weight: bold; font-size: 0.9em;"></span>
                    <button onclick="window.ResetCounters()" style="background-color: #f39c12">Reset Counter</button>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="settings-saved-msg" style="color: #2ecc71; opacity: 0; transition: opacity 0.3s;">Saved!</span>
                    <button onclick="window.SaveSettings()" style="background-color: #27ae60">Save All Configuration</button>
                </div>
            </div>
        </div>

        <div id="logs" class="log-area"></div>
    </div>
    <script src="./src/main.js" type="module"></script>
</body>
</html>
